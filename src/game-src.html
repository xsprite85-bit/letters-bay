<title>מפרץ האותיות</title>

<link rel="apple-touch-icon" href="icon/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* Layout: one 16:10 stage that holds everything; scenes swap inside it, the companion element persists and glides between scenes. Deliberately a single dark-sea look in both themes. */
:root{
  --bg:#07222E; --fg:#E8F6F8; --muted:#8FB4BD; --line:#1B4656;
  --ink:#12395A; --sky:#BDEBFF; --gold:#FFC83D; --acc:#FF7A59; --ok:#32B36B; --pan:#FFFFFF; --pan2:#E8F8FF;
  --tur:#3DBE8B; --tur2:#2A9C6F; --skin:#FFC9A3; --sand:#FFD98A; --sand2:#F2B95A;
  --f-display:'Secular One','Rubik',system-ui,sans-serif; --f-body:'Rubik',system-ui,sans-serif; --f-read:'Noto Sans Hebrew','Rubik',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);margin:0;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{max-width:1000px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top p{margin:0;color:var(--muted);font-size:13px}
.top button{font:inherit;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#game{background:linear-gradient(#7FD6F0,#0F6A9C);position:relative;width:100%;max-width:1000px;margin:0 auto;aspect-ratio:16/10;overflow:hidden;border-radius:22px;container-type:size;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;direction:rtl;
  --g1:#7FD6F0;--g2:#2BA9D2;--g3:#0F6A9C;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#game.m-deep{--g1:#2B8FB8;--g2:#115B8A;--g3:#06304F}
#game.m-night{--g1:#243B73;--g2:#14284F;--g3:#081530}
#game.m-fog{--g1:#9DB7C4;--g2:#587C92;--g3:#1C3A52}
.st{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.story{font-size:3.6cqw;line-height:1.75}
.story .w{display:inline-block;margin:0 .45cqw;transition:color .25s,transform .25s,text-shadow .25s}
.story .w.on{color:#FFD43D;transform:scale(1.14) translateY(-.2cqw);text-shadow:0 .3cqw 0 #8a4b00,0 0 2cqw rgba(255,212,61,.9)}
.story .w.done{color:#fff7cf}
.jf{position:absolute;left:0;top:0;width:6.4cqw;pointer-events:none;z-index:3;transition:left var(--jd,.5s) linear,top .25s}
.jf svg{display:block;width:100%;overflow:visible;transform:scaleX(-1)}
.story.attop{inset:9cqw 8cqw auto;font-size:3.2cqw;line-height:1.9}
.story.ep{inset:auto 7cqw 4cqw;font-size:3.5cqw}
.eptag{position:absolute;top:5cqw;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:4.4cqw;color:#fff;text-shadow:0 .35cqw 0 var(--ink)}
/* background */
.bg{position:absolute;inset:0;width:100%;height:100%}
.bg stop{transition:stop-color 1.2s}
.wv{animation:wv 14s linear infinite}.wv2{animation:wv 22s linear infinite reverse}
@keyframes wv{to{transform:translateX(-1000px)}}
.ray{animation:ray 6s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.05}to{opacity:.2}}
.kelp{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.swim{animation:swim 26s linear infinite}
@keyframes swim{from{transform:translateX(1150px)}to{transform:translateX(-250px)}}
.bub{position:absolute;bottom:-6cqw;border-radius:50%;border:.25cqw solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-120cqh)}}
/* layers */
#scene{position:absolute;inset:0}
#hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:1.6cqw 2cqw;pointer-events:none;z-index:20;transition:opacity .4s}
#hud[hidden]{display:none}
#hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:.8cqw;background:#fff;color:var(--ink);border:.3cqw solid var(--ink);border-radius:5cqw;padding:.5cqw 1.6cqw;font-weight:700;font-size:2.3cqw;box-shadow:0 .4cqw 0 rgba(0,0,0,.18)}
.pill svg{width:2.8cqw;height:2.8cqw}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.tg{font:inherit;width:5cqw;height:5cqw;border-radius:50%;border:.3cqw solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;font-size:2.6cqw;display:grid;place-items:center;padding:0}
.tg[aria-pressed="false"]{opacity:.55;background:#ffd9d9;position:relative}.tg[aria-pressed="false"]::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:.45cqw;background:#e0263a;transform:rotate(-40deg);border-radius:1cqw}
.row{display:flex;gap:1.2cqw;align-items:center}
.btn{font-family:var(--f-display);font-size:3cqw;background:var(--acc);color:#fff;border:.35cqw solid var(--ink);border-radius:5cqw;padding:1cqw 4cqw;cursor:pointer;box-shadow:0 .7cqw 0 var(--ink);transition:transform .1s,box-shadow .1s;line-height:1.1}
.btn:active{transform:translateY(.6cqw);box-shadow:0 .1cqw 0 var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.sm{font-size:2.3cqw;padding:.7cqw 2.4cqw}
.btn[disabled]{opacity:.45;cursor:default}
.ttl{font-family:var(--f-display);color:#fff;text-shadow:0 .5cqw 0 var(--ink),0 0 2cqw rgba(0,0,0,.4);text-align:center;line-height:1.05}
.fill{position:absolute;inset:0}
.ghost{position:absolute;inset:0;pointer-events:none;animation:ghost .24s ease-out forwards}
@keyframes ghost{to{opacity:0}}
.fade{animation:fade .35s both}
@keyframes fade{from{opacity:0;transform:translateY(1cqw)}}
.pop-in{animation:popin .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popin{from{transform:scale(.2);opacity:0}}
/* companion */
#comp{position:absolute;z-index:15;transition:left 1s cubic-bezier(.5,0,.2,1),top 1s cubic-bezier(.5,0,.2,1),width .8s;transform:translate(-50%,-50%);pointer-events:none}
#comp .in{animation:bob 3.2s ease-in-out infinite}
#comp.cheer .in{animation:cheer .9s}
#comp.fx .in{visibility:hidden;animation:none}
#comp.fx{aspect-ratio:1.15}
#comp svg{width:100%;display:block;overflow:visible}
@keyframes bob{50%{transform:translateY(-1.2cqw) rotate(2deg)}}
@keyframes cheer{25%{transform:translateY(-4cqw) rotate(-8deg) scale(1.1)}55%{transform:translateY(0) rotate(8deg)}80%{transform:translateY(-1.5cqw) rotate(-3deg)}}
#bubble{position:absolute;z-index:16;background:#fff;color:var(--ink);border:.35cqw solid var(--ink);border-radius:2.6cqw;padding:1.2cqw 2.2cqw;font-weight:700;font-size:2.6cqw;line-height:1.3;max-width:34cqw;
  box-shadow:0 .5cqw 0 rgba(0,0,0,.2);opacity:0;transform:translate(-50%,-100%) scale(.7);transform-origin:50% 100%;transition:opacity .25s,transform .25s;pointer-events:none;font-family:var(--f-read)}
#bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.nextHit{position:absolute;z-index:17;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;border-radius:50%;visibility:hidden}
.nextHit::before{content:"";position:absolute;inset:-16%;border-radius:50%;background:radial-gradient(circle,rgba(255,212,61,.6),rgba(255,212,61,0) 68%);animation:nhp 1.3s ease-in-out infinite;pointer-events:none}
@keyframes nhp{50%{transform:scale(1.2);opacity:.5}}
@media (prefers-reduced-motion:reduce){.nextHit::before{animation:none}}
/* title/story */
.rd{font-family:var(--f-read)}
.story{position:absolute;inset:auto 6cqw 5cqw;text-align:center;font-size:3.2cqw;font-weight:700;color:#fff;text-shadow:0 .3cqw 0 var(--ink),0 0 1.5cqw #000;line-height:1.4}
.drift{position:absolute;font-family:var(--f-read);font-weight:700;color:#fff;text-shadow:0 .3cqw 0 var(--ink);animation:drift linear forwards;pointer-events:none}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
.rain{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(105deg,transparent 48%,rgba(255,255,255,.4) 50%,transparent 52%);background-size:3cqw 7cqw;animation:rain .35s linear infinite;opacity:.55}
@keyframes rain{to{background-position:-3cqw 7cqw}}
/* map */
.isl{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;font:inherit}
.isl svg{display:block;width:100%;overflow:visible}
.isl.go{animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translate(-50%,-53%)}}
.quest{position:absolute;top:9cqw;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1.4cqw;background:rgba(255,255,255,.92);border:.3cqw solid var(--ink);border-radius:5cqw;padding:.7cqw 2cqw;color:var(--ink);font-weight:700;font-size:2.2cqw;white-space:nowrap}
.slot{width:4.6cqw;height:4.6cqw;border-radius:50%;border:.3cqw dashed var(--ink);display:grid;place-items:center;font-family:var(--f-read);font-weight:700;font-size:3cqw;background:#fff}
.slot.on{border-style:solid;background:var(--gold)}
.dock{position:absolute;bottom:2.2cqw;left:0;right:0;display:flex;justify-content:center;gap:2cqw;z-index:12}
/* lesson */
.dots{position:absolute;top:9cqw;left:50%;transform:translateX(-50%);display:flex;gap:1.2cqw}
.dots i{width:2.2cqw;height:2.2cqw;border-radius:50%;background:rgba(255,255,255,.4);border:.25cqw solid var(--ink)}
.dots i.on{background:var(--gold)}
.big{font-family:var(--f-read);font-weight:700;line-height:1;color:#fff;text-shadow:0 1cqw 0 var(--ink)}
.orb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34cqw;height:34cqw;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#bfeaff 55%,#6fc6ee);border:.5cqw solid var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 6cqw rgba(255,255,255,.5);animation:orb 3s ease-in-out infinite;font-size:24cqw;color:var(--acc);font-family:var(--f-read);font-weight:700;border-style:solid}
@keyframes orb{50%{transform:translate(-50%,-52%) scale(1.04)}}
.orb.ring::after{content:"";position:absolute;inset:-1cqw;border-radius:50%;border:.6cqw solid #fff;animation:ring .8s both}
@keyframes ring{to{transform:scale(1.4);opacity:0}}
.catchb{position:absolute;border-radius:50%;border:.4cqw solid var(--ink);background:radial-gradient(circle at 32% 28%,#fff,#d9f3ff 55%,#8fd2f0);display:grid;place-items:center;cursor:pointer;
  font-family:var(--f-read);font-weight:700;color:var(--ink);animation:rise2 linear forwards;padding:0}
@keyframes rise2{from{transform:translateY(0)}to{transform:translateY(-135cqh)}}
.catchb.wob{animation:wob .45s}
@keyframes wob{25%{transform:translateX(-1cqw) rotate(-8deg)}75%{transform:translateX(1cqw) rotate(8deg)}}
.tr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52cqw;height:32.5cqw;border-radius:3cqw;background:rgba(255,255,255,.22);border:.4cqw dashed rgba(255,255,255,.8)}
.tr canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bar{position:absolute;bottom:-3.4cqw;left:10%;right:10%;height:1.8cqw;border-radius:2cqw;background:rgba(0,0,0,.3);border:.25cqw solid var(--ink);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
.tiles{display:flex;gap:1.6cqw;justify-content:center;direction:rtl}
.tile{font-family:var(--f-read);font-weight:700;font-size:9cqw;min-width:11cqw;height:13cqw;padding:0 1.4cqw;display:grid;place-items:center;background:#fff;color:var(--ink);border:.4cqw solid var(--ink);border-radius:2.4cqw;
  box-shadow:0 .8cqw 0 var(--ink);cursor:pointer;line-height:1.5}
.tile.hl{background:var(--gold);animation:tpulse .7s ease-in-out infinite alternate}
@keyframes tpulse{to{transform:scale(1.08)}}
.tile.hit{animation:hit .4s}
@keyframes hit{40%{transform:translateY(-1.6cqw) scale(1.12)}}
.card{background:#fff;border:.4cqw solid var(--ink);border-radius:2.6cqw;display:grid;place-items:center;cursor:pointer;box-shadow:0 .8cqw 0 var(--ink);padding:1cqw;transition:transform .15s;font:inherit}
.card:hover{transform:translateY(-.8cqw)}
.card svg{width:100%;height:100%;display:block}
.card.no{animation:wob .5s;opacity:.35}
.card.win{background:#dcffe8;animation:win .6s}
@keyframes win{40%{transform:scale(1.15)}}
.card.ghost{opacity:.18;pointer-events:none}
.card.glow{animation:tpulse .6s ease-in-out infinite alternate}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.bobi{animation:bob 2.6s ease-in-out infinite}
.lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
.open .lid{transform:translateY(-22%) rotate(-12deg)}
.chestglow{opacity:0;transition:opacity .6s}.open .chestglow{opacity:1}
.part{position:absolute;pointer-events:none;z-index:30}
.shopgrid{display:flex;gap:2.4cqw;justify-content:center}
.item{width:20cqw;background:#fff;border:.4cqw solid var(--ink);border-radius:2.6cqw;padding:1.4cqw;text-align:center;color:var(--ink);font-weight:700;font-size:2.2cqw;box-shadow:0 .8cqw 0 var(--ink)}
.item svg{width:100%;height:11cqw;display:block}
.eyes{animation:eyes 4s infinite}
@keyframes eyes{0%,40%,100%{opacity:0}45%,90%{opacity:1}92%{opacity:0}94%{opacity:1}}
.shake{animation:shk .9s}
@keyframes shk{20%{transform:translate(-.6cqw,.3cqw)}40%{transform:translate(.6cqw,-.3cqw)}60%{transform:translate(-.4cqw,.2cqw)}80%{transform:translate(.4cqw,0)}}
@media (prefers-reduced-motion:reduce){.wv,.wv2,.kelp,.swim,.bub,.ray,.isl.go,#comp .in{animation:none}}
html:not(.rot) #game:fullscreen,html:not(.rot) #game:-webkit-full-screen{width:min(100vw,160vh);height:min(100vh,62.5vw);max-width:none;margin:auto;border-radius:0;box-shadow:none}
#game::backdrop{background:#04141c}
#rot{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:3cqw;background:#06283c;color:#fff;font-family:var(--f-display);font-size:4cqw;text-align:center;padding:6cqw}
#rot svg{width:16cqw;animation:rotp 2s ease-in-out infinite}
@keyframes rotp{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
html.rot,html.rot body{height:100%;overflow:hidden;background:#06222f}
html.rot body{padding:0;margin:0}
html.rot .top{display:none}
html.rot #game{--w:min(100vh,160vw);position:fixed;width:var(--w);height:calc(var(--w)*.625);max-width:none;margin:0;border-radius:0;box-shadow:none;left:calc((100vw + var(--w)*.625)/2);top:calc((100vh - var(--w))/2);transform-origin:0 0;transform:rotate(90deg)}
</style>

<div class="top" dir="rtl" lang="he">
  <p>אב טיפוס משחק, פרק 1. אפשר ללחוץ, לצייר ולשחק. עדיף במצב אופקי ועם קול.</p>
  <span><button id="fsBtn" type="button">מסך מלא</button> <button id="restart" type="button">להתחיל מחדש</button></span>
</div>

<div id="game" class="m-day" lang="he" dir="rtl">
  <div id="scene"></div>
  <div id="comp"><div class="in"></div></div>
  <div id="bubble" class="rd" role="status" aria-live="polite"></div>
  <div id="hud" hidden>
    <div class="row">
      <div class="pill" id="pStars" aria-label="כוכבים"></div>
      <div class="pill" id="pCoins" aria-label="מטבעות"></div>
    </div>
    <div class="row">
      <button class="tg" id="tgMusic" type="button" aria-pressed="true" aria-label="מוזיקה" title="מוזיקה">♪</button>
      <button class="tg" id="tgVoice" type="button" aria-pressed="true" aria-label="דיבור" title="דיבור">🗣</button>
    </div>
  </div>
  <div id="flash"></div>
  <div id="rot" role="alert"><svg viewBox="0 0 60 100"><rect x="8" y="4" width="44" height="92" rx="9" fill="none" stroke="#fff" stroke-width="5"/><circle cx="30" cy="84" r="4" fill="#fff"/></svg><div>סובבי את המכשיר לרוחב</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script>
<script>
/* Rotated-landscape support: on a portrait screen the whole game is turned 90 degrees so it always plays in landscape (needed e.g. inside the phone app, where the page cannot rotate itself). GL converts screen coordinates to game coordinates. */
(function(){
var G=document.getElementById('game'),H=document.documentElement;
var GL=window.GL={rot:false};
function upd(){var r=innerHeight>innerWidth&&innerWidth<900;GL.rot=r;H.classList.toggle('rot',r)}
upd();addEventListener('resize',upd);addEventListener('orientationchange',function(){setTimeout(upd,200)});document.addEventListener('fullscreenchange',upd);
function loc(el){var a=el.getBoundingClientRect(),b=G.getBoundingClientRect();
  if(!GL.rot)return {left:a.left-b.left,top:a.top-b.top,width:a.width,height:a.height};
  var cx=a.left+a.width/2,cy=a.top+a.height/2,w=a.height,h=a.width,lx=cy-b.top,ly=b.right-cx;return {left:lx-w/2,top:ly-h/2,width:w,height:h}}
GL.rect=loc;
GL.uv=function(el,e){var a=el.getBoundingClientRect();return GL.rot?[(e.clientY-a.top)/a.height,(a.right-e.clientX)/a.width]:[(e.clientX-a.left)/a.width,(e.clientY-a.top)/a.height]};
})();
</script>
<script>
/* PixiJS visual layer: sea world behind the interface, animated companions above it. Exposes window.FX. */
(function(){
var G=document.getElementById('game'),COMP=document.getElementById('comp');
var FX=window.FX={ready:false,mood:'m-day',kind:'t',hat:null,happyT:-10,setMood:function(m){FX.mood=m},setComp:function(k,h){FX.kind=k;FX.hat=h;if(FX._swap)FX._swap()},happy:function(){FX.happyT=FX._now||0}};
if(!window.PIXI||/nofx/.test(location.search))return;

function rnd(a,b){return a+Math.random()*(b-a)}
function grad(stops,x0,y0,x1,y1){return new P.FillGradient({type:'linear',start:{x:x0,y:y0},end:{x:x1,y:y1},colorStops:stops.map(function(s){return {offset:s[0],color:s[1]}})})}
function rgrad(stops,cx,cy,r){return new P.FillGradient({type:'radial',center:{x:cx,y:cy},innerRadius:0,outerCenter:{x:cx,y:cy},outerRadius:r,colorStops:stops.map(function(s){return {offset:s[0],color:s[1]}})})}
function cv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
function bubbleTex(n){var c=cv(n,n),g=c.getContext('2d'),r=n/2;
  var gr=g.createRadialGradient(r,r,r*.35,r,r,r*.98);gr.addColorStop(0,'rgba(190,240,255,.06)');gr.addColorStop(.8,'rgba(160,225,255,.22)');gr.addColorStop(1,'rgba(255,255,255,.55)');
  g.fillStyle=gr;g.beginPath();g.arc(r,r,r*.97,0,TAU);g.fill();g.lineWidth=n*.012;
  var rim=g.createLinearGradient(0,0,n,n);rim.addColorStop(0,'rgba(255,255,255,.95)');rim.addColorStop(.5,'rgba(255,255,255,.25)');rim.addColorStop(1,'rgba(255,255,255,.7)');g.strokeStyle=rim;g.stroke();
  g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.ellipse(r*.58,r*.42,r*.2,r*.1,-.7,0,TAU);g.fill();return P.Texture.from(c)}
