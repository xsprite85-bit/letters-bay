<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#5FD0F2"/>
      <stop offset=".55" stop-color="#1E86C4"/>
      <stop offset="1" stop-color="#0B3E66"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF3B0" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#FFD43D" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFD43D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9803F"/>
      <stop offset="1" stop-color="#8A4E22"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D99252"/>
      <stop offset="1" stop-color="#A9622E"/>
